[package]
name = "op-se"
version = "0.2.0"
edition = "2021"
description = "A Rust-native, open-source AI code editor: inline edit, chat, multi-file agent and local codebase indexing"
license = "MIT"

[dependencies]
eframe = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
similar = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
getrandom = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
url = "2"
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
